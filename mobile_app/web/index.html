<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="findme_tricycle_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link href="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    /* No on-map ⓘ attribution button: it sat over the tab bar and kept
       getting tapped. On web maplibre_gl ignores attributionButtonMargins
       (see AppMap), so it's hidden here; the "© OpenStreetMap contributors"
       credit is in Settings → Map. */
    .maplibregl-ctrl-attrib,
    .maplibregl-ctrl-logo {
      display: none !important;
    }
  </style>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>findme_tricycle_mobile</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
