name: findme_tricycle_mobile
description: FindMeTricycle Flutter app for Passenger and Driver.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^3.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  maplibre_gl: ^0.26.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Guiuan's service area, exported from the backend
    # (cd backend && npm run service-area:export).
    - assets/service_area/
  fonts:
    # Prism Night type (SIL OFL): Geist for text, Geist Mono for labels and
    # numbers, Instrument Serif italic for the big accents.
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-ExtraBold.ttf
          weight: 800
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
